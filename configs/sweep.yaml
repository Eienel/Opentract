# Sweep spec for scripts/sweep.py -- Day-5 ICL tuning on a held-out dev split.
#
# Workflow:
#   1. python scripts/make_dev_split.py --config configs/default.yaml \
#        --tune-out data/real/unified_tune.jsonl --dev-out data/real/dev.jsonl
#   2. python scripts/sweep.py --sweep configs/sweep.yaml
#   3. inspect configs/best.yaml, then annotate the real eval set with it.
#
# Cost: each grid cell = one full pass over dev_eval. With a paid API, keep the
# dev set small (~50-100 rows) and trim the grid before running.

base: configs/default.yaml
dev_unified: data/real/unified_tune.jsonl   # retrieval pool (tune split)
dev_eval: data/real/dev.jsonl               # held-out, labelled -> scored
out_best: configs/best.yaml

grid:
  retrieval.k_shots: [3, 5, 10]
  retrieval.strategy: [similarity, class_balanced]
  retrieval.ordering: [similar_last, similar_first]
  self_consistency.n: [1, 3]
  backend.thinking_mode: [false, true]
